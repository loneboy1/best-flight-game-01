<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NUSA RESCUE — Island Rescue Seaplane</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e2a3d;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .panel { background: rgba(8, 28, 44, .62); border: 1px solid rgba(255,255,255,.22);
    border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(2px); }
  #top-left { position: absolute; top: 12px; left: 12px; }
  #top-left .row { display: flex; gap: 18px; }
  .gauge label { font-size: 10px; letter-spacing: .14em; color: #ffd76b; display: block; }
  .gauge .val { font-size: 22px; font-weight: 700; line-height: 1.1; }
  #compass { margin-top: 6px; font-size: 12px; letter-spacing: .2em; color: #cfe8ff;
    display: flex; gap: 10px; justify-content: center; }
  #top-right { position: absolute; top: 12px; right: 12px; text-align: right; min-width: 170px; }
  #score { font-size: 30px; font-weight: 800; color: #ffe14d; line-height: 1; }
  #score-label { font-size: 10px; letter-spacing: .2em; color: #cfe8ff; }
  #timer { font-size: 24px; font-weight: 800; color: #ff9d5c; margin-top: 4px; }
  #mission { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 520px; }
  #mission-title { font-size: 17px; font-weight: 800; color: #ffe14d; letter-spacing: .04em; }
  #mission-brief { font-size: 12px; color: #eaf6ff; margin-top: 2px; }
  #mission-state { font-size: 12px; color: #9fe8b0; margin-top: 3px; font-weight: 600; }
  #bottom-left { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; }
  #horizon { border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(8,28,44,.5); }
  .bars { display: flex; flex-direction: column; gap: 6px; width: 190px; }
  .bar-row { font-size: 11px; }
  .bar-row label { display: flex; justify-content: space-between; letter-spacing: .1em; color: #cfe8ff; }
  .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 2px; }
  .bar .fill { height: 100%; background: #35c163; transition: width .15s linear; }
  .bar .fill.low { background: #ff5252; }
  #dmg-fill { background: #ff8a3d; }
  #thr-fill { background: #4db2ff; }
  #bottom-right { position: absolute; right: 12px; bottom: 12px; text-align: right;
    font-size: 11px; color: #cfe8ff; line-height: 1.7; }
  #storm-warn, #fuel-warn { display: none; font-weight: 800; font-size: 14px; padding: 4px 10px;
    border-radius: 6px; margin-top: 6px; }
  #storm-warn { background: #b71c1c; color: #fff; animation: blink 0.7s steps(2) infinite; }
  #fuel-warn { background: #ff8f00; color: #fff; }
  @keyframes blink { 50% { opacity: .45; } }
  #message { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    font-size: 16px; font-weight: 700; color: #fff; background: rgba(8,28,44,.72);
    padding: 8px 18px; border-radius: 20px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #message.show { opacity: 1; }
  #banner { position: absolute; left: 50%; top: 34%; transform: translateX(-50%); text-align: center;
    display: none; }
  .banner-title { font-size: 44px; font-weight: 900; color: #ffe14d; letter-spacing: .05em;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 24px rgba(255,180,60,.5); }
  .banner-sub { font-size: 16px; color: #fff; margin-top: 6px; }

  /* ---------- Title / crash overlay ---------- */
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center;
    justify-content: center; background: rgba(6, 20, 32, .45); pointer-events: none; }
  .title-card { text-align: center; max-width: 620px; padding: 34px 40px; pointer-events: auto;
    background: rgba(8, 28, 44, .78); border: 1px solid rgba(255,225,77,.4); border-radius: 18px; }
  .title-kicker { font-size: 12px; letter-spacing: .35em; color: #ffd76b; font-weight: 700; }
  .title-card h1 { font-size: 58px; font-weight: 900; letter-spacing: .03em; color: #ffe14d;
    text-shadow: 0 4px 0 rgba(0,0,0,.3); margin: 6px 0 10px; }
  .title-card p { font-size: 15px; color: #eaf6ff; line-height: 1.5; }
  .controls-grid { margin: 18px 0; font-size: 13px; color: #cfe8ff; line-height: 2; }
  .controls-grid b { color: #fff; background: rgba(255,255,255,.14); padding: 1px 7px; border-radius: 5px; }
  .cta { margin-top: 10px; font-size: 17px !important; font-weight: 800; color: #9fe8b0 !important;
    animation: blink 1.4s steps(2) infinite; }

  /* ---------- Touch controls ---------- */
  .touch { position: fixed; z-index: 8; display: none; gap: 10px; }
  .touch button { pointer-events: auto; width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5); background: rgba(8,28,44,.55); color: #fff;
    font-size: 20px; font-weight: 800; }
  .touch button:active { background: rgba(255,180,60,.6); }
  #touch-left { left: 14px; bottom: 90px; }
  #touch-right { right: 14px; bottom: 90px; }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="top-left" class="panel">
    <div class="row">
      <div class="gauge"><label>ALTITUDE</label><div class="val" id="alt">0 m</div></div>
      <div class="gauge"><label>SPEED</label><div class="val" id="spd">0 km/h</div></div>
      <div class="gauge"><label>HEADING</label><div class="val" id="hdg">090°</div></div>
    </div>
    <div id="compass"></div>
  </div>
  <div id="mission" class="panel">
    <div id="mission-title">NUSA RESCUE</div>
    <div id="mission-brief">Press ENTER to start</div>
    <div id="mission-state"></div>
  </div>
  <div id="top-right" class="panel">
    <div id="score-label">SCORE</div>
    <div id="score">0</div>
    <div id="timer" style="display:none"></div>
    <div id="storm-warn">⚠ STORM — GET OUT</div>
    <div id="fuel-warn">LOW FUEL — RETURN TO BASE</div>
  </div>
  <div id="bottom-left">
    <canvas id="horizon" width="96" height="96"></canvas>
    <div class="bars">
      <div class="bar-row"><label><span>FUEL</span><span id="fuel-pct"></span></label><div class="bar"><div class="fill" id="fuel-fill" style="width:100%"></div></div></div>
      <div class="bar-row"><label><span>HULL</span></label><div class="bar"><div class="fill" id="dmg-fill" style="width:0%"></div></div></div>
      <div class="bar-row"><label><span>THROTTLE</span><span id="thr-val">0%</span></label><div class="bar"><div class="fill" id="thr-fill" style="width:0%"></div></div></div>
    </div>
  </div>
  <div id="bottom-right">
    ↑↓ pitch · ←→ bank<br>
    SHIFT throttle · SPACE drop<br>
    C camera · R restart · P pause
  </div>
  <div id="message"></div>
  <div id="banner"></div>
</div>

<div id="overlay"></div>

<div class="touch" id="touch-left">
  <button id="btn-throttle-down">−</button>
  <button id="btn-throttle-up">+</button>
</div>
<div class="touch" id="touch-right">
  <button id="btn-action">DROP</button>
  <button id="btn-cam">CAM</button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
